# fly.toml app configuration file generated for voice1 on 2026-10-11T14:22:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voice1'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
